# Desk Clock - builds the whole app in the cloud and publishes the APK.
# Paste this file as .github/workflows/build.yml in a GitHub repository.
name: Build Desk Clock APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write the app source files
        run: |
          set -e
          mkdir -p app/src/main/java/com/deskclock/app app/src/main/res/values app/src/main/res/mipmap-xxhdpi
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DeskClock"
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF_FILE
          cat > app/build.gradle <<'EOF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.deskclock.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.deskclock.app'
                  minSdk 24          // Android 7.0 (Xperia XA)
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      // Signed with the debug key so the release APK is installable too.
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  abortOnError false
              }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|navigation|uiMode"
                      android:screenOrientation="fullSensor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          EOF_FILE
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF_FILE
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Desk Clock</string>
          </resources>
          EOF_FILE
          cat > app/src/main/java/com/deskclock/app/ClockView.java <<'EOF_FILE'
          package com.deskclock.app;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.format.DateFormat;
          import android.util.AttributeSet;
          import android.view.View;

          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Locale;

          /**
           * A single view that draws the whole clock: huge hour/minute digits, a thin seconds
           * progress bar and a date line. Digits are drawn in fixed-width cells so the layout
           * never jiggles when the time changes. Everything is recomputed on every draw, so
           * rotation, theme changes and time-zone changes need no special handling.
           */
          public class ClockView extends View {

              /** { background, digits, accent } */
              private static final int[][] THEMES = {
                      {0xFF000000, 0xFFFFFFFF, 0xFF4FC3F7},   // Midnight
                      {0xFF000000, 0xFFFFB300, 0xFFFF6D00},   // Amber
                      {0xFF06100C, 0xFFB9F6CA, 0xFF1DE9B6},   // Mint
                      {0xFF120E22, 0xFFF3E5F5, 0xFFFF80AB},   // Dusk
                      {0xFFF4F1EA, 0xFF1C1B1A, 0xFFE64A19},   // Paper
              };

              private static final float REF_SIZE = 200f;
              private static final float DIM_ALPHA = 0.55f;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Rect bounds = new Rect();
              private final RectF rect = new RectF();

              private Paint digitPaint;
              private Paint infoPaint;
              private Paint barPaint;
              private Paint dotPaint;
              private SimpleDateFormat dateFormat;

              private int themeIndex = 0;
              private boolean use24 = true;
              private boolean dim = false;
              private boolean running = false;

              private String hourStr = "00";
              private String minStr = "00";
              private String secStr = "00";
              private String dateStr = "";
              private String rightStr = "";
              private int second = 0;

              private final Runnable ticker = new Runnable() {
                  @Override
                  public void run() {
                      if (!running) {
                          return;
                      }
                      invalidate();
                      long now = System.currentTimeMillis();
                      // Wake up just after the next whole second.
                      handler.postDelayed(this, 1000 - (now % 1000) + 15);
                  }
              };

              public ClockView(Context context) {
                  super(context);
                  init();
              }

              public ClockView(Context context, AttributeSet attrs) {
                  super(context, attrs);
                  init();
              }

              private void init() {
                  setKeepScreenOn(true);

                  Typeface light = Typeface.create("sans-serif-light", Typeface.NORMAL);

                  digitPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
                  digitPaint.setTypeface(light);
                  digitPaint.setTextAlign(Paint.Align.CENTER);

                  infoPaint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.SUBPIXEL_TEXT_FLAG);
                  infoPaint.setTypeface(light);
                  infoPaint.setLetterSpacing(0.04f);

                  barPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  barPaint.setStyle(Paint.Style.FILL);

                  dotPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  dotPaint.setStyle(Paint.Style.FILL);

                  String pattern;
                  try {
                      pattern = DateFormat.getBestDateTimePattern(Locale.getDefault(), "EEEEdMMMM");
                  } catch (RuntimeException e) {
                      pattern = "EEEE, d MMMM";
                  }
                  dateFormat = new SimpleDateFormat(pattern, Locale.getDefault());

                  updateTime();
              }

              // ---- public state -------------------------------------------------------------

              public int getThemeIndex() {
                  return themeIndex;
              }

              public void setThemeIndex(int index) {
                  int n = THEMES.length;
                  themeIndex = ((index % n) + n) % n;
                  invalidate();
              }

              public void nextTheme() {
                  setThemeIndex(themeIndex + 1);
              }

              public boolean isUse24() {
                  return use24;
              }

              public void setUse24(boolean value) {
                  use24 = value;
                  updateTime();
                  invalidate();
              }

              public boolean isDim() {
                  return dim;
              }

              public void setDim(boolean value) {
                  dim = value;
                  invalidate();
              }

              /** Start the once-a-second redraw loop (call from onResume). */
              public void start() {
                  running = true;
                  handler.removeCallbacks(ticker);
                  ticker.run();
              }

              /** Stop the redraw loop (call from onPause). */
              public void stop() {
                  running = false;
                  handler.removeCallbacks(ticker);
              }

              @Override
              protected void onDetachedFromWindow() {
                  stop();
                  super.onDetachedFromWindow();
              }

              // ---- time ---------------------------------------------------------------------

              private static String two(int v) {
                  return v < 10 ? "0" + v : String.valueOf(v);
              }

              private void updateTime() {
                  final Calendar c = Calendar.getInstance();
                  final int hour = c.get(Calendar.HOUR_OF_DAY);
                  final int minute = c.get(Calendar.MINUTE);
                  second = c.get(Calendar.SECOND);

                  int shown = hour;
                  if (!use24) {
                      shown = hour % 12;
                      if (shown == 0) {
                          shown = 12;
                      }
                  }
                  hourStr = two(shown);
                  minStr = two(minute);
                  secStr = two(second);

                  dateFormat.setTimeZone(c.getTimeZone());
                  dateStr = dateFormat.format(c.getTime());

                  rightStr = use24 ? secStr : (hour < 12 ? "AM" : "PM") + "  " + secStr;
              }

              // ---- drawing ------------------------------------------------------------------

              private static int withAlpha(int color, float alpha) {
                  int a = Math.round(255f * Math.max(0f, Math.min(1f, alpha)));
                  return (a << 24) | (color & 0x00FFFFFF);
              }

              /** Draw the characters of s centred on centerX, one fixed-width cell per character. */
              private void drawCells(Canvas canvas, String s, float centerX, float baseline, float cell) {
                  final int n = s.length();
                  float x = centerX - cell * n / 2f + cell / 2f;
                  for (int i = 0; i < n; i++) {
                      canvas.drawText(s, i, i + 1, x, baseline, digitPaint);
                      x += cell;
                  }
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  updateTime();

                  final int w = getWidth();
                  final int h = getHeight();
                  if (w <= 0 || h <= 0) {
                      return;
                  }

                  final int[] theme = THEMES[themeIndex];
                  final float alpha = dim ? DIM_ALPHA : 1f;
                  final int fg = withAlpha(theme[1], alpha);
                  final int accent = withAlpha(theme[2], alpha);

                  canvas.drawColor(theme[0]);

                  final boolean portrait = h > w;
                  final float density = getResources().getDisplayMetrics().density;

                  // Measure the digit metrics at a reference size, then scale to fit the screen.
                  digitPaint.setTextSize(REF_SIZE);
                  float maxAdvance = 0f;
                  for (char ch = '0'; ch <= '9'; ch++) {
                      float adv = digitPaint.measureText(String.valueOf(ch));
                      if (adv > maxAdvance) {
                          maxAdvance = adv;
                      }
                  }
                  digitPaint.getTextBounds("8", 0, 1, bounds);
                  final float refDigitH = bounds.height();
                  final float refGlyphW = bounds.width();
                  final float refMid = (bounds.top + bounds.bottom) / 2f; // glyph centre relative to baseline
                  if (refDigitH <= 0f || maxAdvance <= 0f) {
                      return;
                  }

                  final float refCell = maxAdvance * 1.06f;
                  final float refColon = refCell * 0.42f;
                  final float refGap = refDigitH * 0.14f;
                  final float refBlockW = portrait ? 2f * refCell : 4f * refCell + refColon;
                  final float refBlockH = portrait ? 2f * refDigitH + refGap : refDigitH;

                  final float maxW = w * (portrait ? 0.82f : 0.90f);
                  final float maxH = h * (portrait ? 0.68f : 0.60f);
                  final float scale = Math.min(maxW / refBlockW, maxH / refBlockH);

                  final float cell = refCell * scale;
                  final float colonW = refColon * scale;
                  final float digitH = refDigitH * scale;
                  final float gap = refGap * scale;
                  final float blockW = refBlockW * scale;
                  final float blockH = refBlockH * scale;
                  final float mid = refMid * scale;
                  final float inset = Math.max(0f, (refCell - refGlyphW) / 2f * scale);

                  digitPaint.setTextSize(REF_SIZE * scale);
                  digitPaint.setColor(fg);

                  // Vertical layout: digits, seconds bar, info line - centred as a group.
                  final float barH = 4f * density;
                  final float gap1 = 22f * density;
                  final float gap2 = 14f * density;

                  final float cx = w / 2f;
                  final float blockLeft = cx - blockW / 2f;
                  final float barLeft = blockLeft + inset;
                  final float barRight = blockLeft + blockW - inset;
                  final float barWidth = barRight - barLeft;

                  // Shrink the info text until the date and the seconds both fit on one line.
                  float infoSize = 18f * density;
                  final float minInfo = 10f * density;
                  for (int i = 0; i < 20; i++) {
                      infoPaint.setTextSize(infoSize);
                      float needed = infoPaint.measureText(dateStr) + infoPaint.measureText(rightStr) + 24f * density;
                      if (needed <= barWidth || infoSize <= minInfo) {
                          break;
                      }
                      infoSize = Math.max(minInfo, infoSize * 0.92f);
                  }
                  infoPaint.setTextSize(infoSize);

                  final float contentH = blockH + gap1 + barH + gap2 + infoSize;
                  final float top = Math.max(0f, (h - contentH) / 2f);

                  // Digits.
                  if (portrait) {
                      final float c1 = top + digitH / 2f;
                      final float c2 = top + digitH + gap + digitH / 2f;
                      drawCells(canvas, hourStr, cx, c1 - mid, cell);
                      drawCells(canvas, minStr, cx, c2 - mid, cell);
                  } else {
                      final float centerY = top + digitH / 2f;
                      final float baseline = centerY - mid;
                      drawCells(canvas, hourStr, blockLeft + cell, baseline, cell);
                      drawCells(canvas, minStr, blockLeft + 2f * cell + colonW + cell, baseline, cell);

                      final float dotX = blockLeft + 2f * cell + colonW / 2f;
                      final float dotR = Math.max(2f * density, digitH * 0.05f);
                      dotPaint.setColor(accent);
                      canvas.drawCircle(dotX, centerY - digitH * 0.17f, dotR, dotPaint);
                      canvas.drawCircle(dotX, centerY + digitH * 0.17f, dotR, dotPaint);
                  }

                  // Seconds progress bar.
                  final float barTop = top + blockH + gap1;
                  final float barBottom = barTop + barH;
                  rect.set(barLeft, barTop, barRight, barBottom);
                  barPaint.setColor(withAlpha(theme[2], alpha * 0.22f));
                  canvas.drawRoundRect(rect, barH / 2f, barH / 2f, barPaint);

                  final float fillW = barWidth * (second + 1) / 60f;
                  rect.set(barLeft, barTop, barLeft + fillW, barBottom);
                  barPaint.setColor(accent);
                  canvas.drawRoundRect(rect, barH / 2f, barH / 2f, barPaint);

                  // Info line: date on the left, (AM/PM and) seconds on the right.
                  final float infoBaseline = barBottom + gap2 + infoSize * 0.8f;
                  infoPaint.setColor(accent);
                  infoPaint.setTextAlign(Paint.Align.LEFT);
                  canvas.drawText(dateStr, barLeft, infoBaseline, infoPaint);
                  infoPaint.setTextAlign(Paint.Align.RIGHT);
                  canvas.drawText(rightStr, barRight, infoBaseline, infoPaint);
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/deskclock/app/MainActivity.java <<'EOF_FILE'
          package com.deskclock.app;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.text.format.DateFormat;
          import android.view.GestureDetector;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Toast;

          /**
           * Full-screen desk clock.
           *
           * Tap: next style. Double-tap: dim on/off. Long-press: 12/24-hour.
           */
          public class MainActivity extends Activity {

              private static final String PREFS = "deskclock";
              private static final String KEY_THEME = "theme";
              private static final String KEY_USE24 = "use24";
              private static final String KEY_DIM = "dim";
              private static final String KEY_HINT = "hint_shown";

              private static final float DIM_BRIGHTNESS = 0.04f;

              private ClockView clock;
              private SharedPreferences prefs;
              private GestureDetector gestures;
              private Toast toast;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

                  clock = new ClockView(this);
                  clock.setThemeIndex(prefs.getInt(KEY_THEME, 0));
                  clock.setUse24(prefs.getBoolean(KEY_USE24, DateFormat.is24HourFormat(this)));
                  clock.setDim(prefs.getBoolean(KEY_DIM, false));

                  gestures = new GestureDetector(this, new GestureDetector.SimpleOnGestureListener() {
                      @Override
                      public boolean onDown(MotionEvent e) {
                          return true;
                      }

                      @Override
                      public boolean onSingleTapConfirmed(MotionEvent e) {
                          clock.nextTheme();
                          prefs.edit().putInt(KEY_THEME, clock.getThemeIndex()).apply();
                          return true;
                      }

                      @Override
                      public boolean onDoubleTap(MotionEvent e) {
                          clock.setDim(!clock.isDim());
                          prefs.edit().putBoolean(KEY_DIM, clock.isDim()).apply();
                          applyBrightness();
                          showMessage(clock.isDim() ? "Dim mode on" : "Dim mode off");
                          return true;
                      }

                      @Override
                      public void onLongPress(MotionEvent e) {
                          clock.setUse24(!clock.isUse24());
                          prefs.edit().putBoolean(KEY_USE24, clock.isUse24()).apply();
                          showMessage(clock.isUse24() ? "24-hour clock" : "12-hour clock");
                      }
                  });

                  setContentView(clock);
                  applyBrightness();

                  if (!prefs.getBoolean(KEY_HINT, false)) {
                      prefs.edit().putBoolean(KEY_HINT, true).apply();
                      showMessage("Tap: change style\nDouble-tap: dim\nHold: 12/24-hour", true);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  hideSystemUi();
                  clock.start();
              }

              @Override
              protected void onPause() {
                  clock.stop();
                  super.onPause();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  return gestures.onTouchEvent(event) || super.onTouchEvent(event);
              }

              @SuppressWarnings("deprecation")
              private void hideSystemUi() {
                  clock.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              private void applyBrightness() {
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.screenBrightness = clock.isDim()
                          ? DIM_BRIGHTNESS
                          : WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                  getWindow().setAttributes(lp);
              }

              private void showMessage(String text) {
                  showMessage(text, false);
              }

              private void showMessage(String text, boolean longDuration) {
                  if (toast != null) {
                      toast.cancel();
                  }
                  toast = Toast.makeText(this, text, longDuration ? Toast.LENGTH_LONG : Toast.LENGTH_SHORT);
                  toast.show();
              }
          }
          EOF_FILE
